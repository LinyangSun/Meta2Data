name: Build SIF
run-name: Publish validated SIF as ${{ inputs.output_tag }}

on:
  workflow_dispatch:
    inputs:
      output_tag:
        description: Version tag for the already validated SIF (v1.1)
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  publish-tag:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      IMAGE_NAME: linyangsun/meta2data
      SOURCE_TAG: qiime2026.7-silva144-v1
      OUTPUT_TAG: ${{ inputs.output_tag }}
      SOURCE_SHA: b9c9b70c7da9c5c8f0b8d2cad189ce7e4edbc208
      MANIFEST_SHA: e07f288ce27d52fb2aa39271856cd8b43f3df0905039d3aa6aa868c65b6b976b
      SIF_SHA: 84f0093b37cb976cab8974195a20149d291994b677c8d37da16431c86d62dce1
    steps:
      - name: Verify the completed build and publish its unchanged manifest
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$OUTPUT_TAG" == v1.1 ]]
          curl --fail --silent --show-error --retry 3 \
            https://api.github.com/repos/LinyangSun/Meta2Data/actions/runs/44640635399 \
            --output source-run.json
          jq -e --arg sha "$SOURCE_SHA" \
            '.status == "completed" and .conclusion == "success" and .head_sha == $sha' source-run.json
          registry_token=$(curl --fail --silent --show-error --retry 3 \
            --user "${GITHUB_ACTOR}:${GHCR_TOKEN}" --get \
            --data-urlencode 'service=ghcr.io' \
            --data-urlencode "scope=repository:${IMAGE_NAME}:pull,push" \
            https://ghcr.io/token | jq -er '.token // .access_token')
          echo "::add-mask::$registry_token"
          curl --fail --silent --show-error --retry 3 \
            --header "Authorization: Bearer $registry_token" \
            --header 'Accept: application/vnd.oci.image.manifest.v1+json' \
            "https://ghcr.io/v2/${IMAGE_NAME}/manifests/${SOURCE_TAG}" --output manifest.json
          echo "$MANIFEST_SHA  manifest.json" | sha256sum --check -
          jq -e --arg digest "sha256:$SIF_SHA" \
            '.layers | length == 1 and .[0].digest == $digest and .[0].mediaType == "application/vnd.sylabs.sif.layer.v1.sif"' manifest.json
          status=$(curl --silent --show-error --retry 3 \
            --header "Authorization: Bearer $registry_token" \
            --header 'Accept: application/vnd.oci.image.manifest.v1+json' \
            --output target-manifest.json --write-out '%{http_code}' \
            "https://ghcr.io/v2/${IMAGE_NAME}/manifests/${OUTPUT_TAG}")
          case "$status" in
            404)
              curl --fail --silent --show-error --retry 3 --request PUT \
                --header "Authorization: Bearer $registry_token" \
                --header 'Content-Type: application/vnd.oci.image.manifest.v1+json' \
                --data-binary @manifest.json \
                "https://ghcr.io/v2/${IMAGE_NAME}/manifests/${OUTPUT_TAG}" ;;
            200) cmp manifest.json target-manifest.json ;;
            *) echo "::error::Target check failed: HTTP $status"; exit 1 ;;
          esac
          public_token=$(curl --fail --silent --show-error --retry 3 --get \
            --data-urlencode 'service=ghcr.io' \
            --data-urlencode "scope=repository:${IMAGE_NAME}:pull" \
            https://ghcr.io/token | jq -er '.token // .access_token')
          echo "::add-mask::$public_token"
          curl --fail --silent --show-error --retry 3 \
            --header "Authorization: Bearer $public_token" \
            --header 'Accept: application/vnd.oci.image.manifest.v1+json' \
            "https://ghcr.io/v2/${IMAGE_NAME}/manifests/${OUTPUT_TAG}" --output public-manifest.json
          cmp manifest.json public-manifest.json
          jq -n --arg checked "$(date -u +%FT%TZ)" \
            --arg image "oras://ghcr.io/${IMAGE_NAME}:${OUTPUT_TAG}" \
            --arg source_tag "$SOURCE_TAG" --arg source_sha "$SOURCE_SHA" \
            --arg manifest "$MANIFEST_SHA" --arg sif "$SIF_SHA" \
            --argjson size "$(jq '.layers[0].size' manifest.json)" \
            '{checked_utc:$checked,image:$image,source_tag:$source_tag,source_sha:$source_sha,validated_build_run:44640635399,manifest_sha256:$manifest,sif_sha256:$sif,sif_bytes:$size,anonymous_read_verified:true,identical_manifest:true}' > publication.json
          cat publication.json
          {
            echo '## Published Meta2Data SIF v1.1'
            echo
            echo 'The manifest and SIF bytes are identical to the image validated by run 44640635399.'
            echo
            echo 'Download: `apptainer pull Meta2Data-v1.1.sif oras://ghcr.io/linyangsun/meta2data:v1.1`'
            echo
            printf 'SIF SHA-256: `%s`\n' "$SIF_SHA"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Preserve publication evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sif-v1.1-publication
          path: |
            publication.json
            manifest.json
            public-manifest.json
            source-run.json
          retention-days: 14
