name: Illumina PE validation

on:
  push:
    branches: [feature/illumina-pe-project-routing]
    paths: [.github/workflows/illumina-pe-validation.yml]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install validation dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y vsearch
          python -m pip install 'cutadapt>=4,<6' biopython pandas numpy biom-format requests
      - name: Load the checksum-verified source revision and baseline
        run: |
          git fetch --no-tags --depth=1 origin 5b0634fb8db91c71580e770f248fe1dedfd5925c
          git show 5b0634fb8db91c71580e770f248fe1dedfd5925c:.github/workflows/illumina-pe-validation.yml > "$RUNNER_TEMP/patch-source.yml"
          python - <<'PY'
          import base64, hashlib, lzma, os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP'])
          lines = (root / 'patch-source.yml').read_text().splitlines()
          start = next(i for i, line in enumerate(lines) if "<<'PAYLOAD'" in line) + 1
          end = next(i for i in range(start, len(lines)) if lines[i].strip() == 'PAYLOAD')
          patch = lzma.decompress(base64.b64decode(''.join(line.strip() for line in lines[start:end])))
          assert hashlib.sha256(patch).hexdigest() == '770f3f7d92d079e19d52800733db8c564d9a81e6500e8c9c724ce077a0f783e3'
          (root / 'illumina-pe.patch').write_bytes(patch)
          PY
          git fetch --no-tags --depth=1 origin 7109104d946be2fc017e73d374b4cfb25e152fac
          git worktree add --detach "$RUNNER_TEMP/baseline" 7109104d946be2fc017e73d374b4cfb25e152fac
          git apply --check "$RUNNER_TEMP/illumina-pe.patch"
          git apply "$RUNNER_TEMP/illumina-pe.patch"
          git diff --check
      - name: Validate Python and shell syntax
        run: |
          python -m compileall -q scripts tests
          for script in scripts/*.sh bin/*; do bash -n "$script"; done
      - name: Require all new unit and real-tool tests to pass
        run: |
          vsearch --version
          cutadapt --version
          python -m unittest discover -s tests -p test_illumina_pe.py -v 2>&1 | tee "$RUNNER_TEMP/illumina-tests.log"
      - name: Compare complete regression suites without hiding baseline failures
        run: |
          cat > "$RUNNER_TEMP/record-suite.py" <<'PY'
          import json, sys, unittest
          suite = unittest.defaultTestLoader.discover('tests')
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          record = {'tests': result.testsRun,
                    'failures': sorted(test.id() for test, _ in result.failures),
                    'errors': sorted(test.id() for test, _ in result.errors),
                    'skipped': sorted((test.id(), reason) for test, reason in result.skipped)}
          with open(sys.argv[1], 'w') as stream:
              json.dump(record, stream, indent=2)
          PY
          (cd "$RUNNER_TEMP/baseline" && python "$RUNNER_TEMP/record-suite.py" "$RUNNER_TEMP/baseline.json") 2>&1 | tee "$RUNNER_TEMP/baseline.log"
          python "$RUNNER_TEMP/record-suite.py" "$RUNNER_TEMP/revision.json" 2>&1 | tee "$RUNNER_TEMP/revision.log"
          python - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP'])
          base = json.loads((root / 'baseline.json').read_text())
          new = json.loads((root / 'revision.json').read_text())
          for kind in ('failures', 'errors'):
              unexpected = set(new[kind]) - set(base[kind])
              if unexpected:
                  raise SystemExit(f'New {kind}: {sorted(unexpected)}')
          extra_skips = {tuple(row) for row in new['skipped']} - {tuple(row) for row in base['skipped']}
          if extra_skips:
              raise SystemExit(f'New skipped tests: {sorted(extra_skips)}')
          if new['tests'] != base['tests'] + 28:
              raise SystemExit('Unexpected test discovery count')
          summary = ('## Regression comparison\n'
                     f"Baseline: {base['tests']} tests, {len(base['failures'])} failures, {len(base['errors'])} errors, {len(base['skipped'])} skipped.\n\n"
                     f"Revision: {new['tests']} tests, {len(new['failures'])} failures, {len(new['errors'])} errors, {len(new['skipped'])} skipped.\n\n"
                     'All 28 new Illumina PE tests passed, including real VSEARCH/Cutadapt tests. No additional regression failures or skips.\n\n'
                     'Existing baseline failures (not changed by this revision):\n' +
                     ''.join(f'- `{name}`\n' for name in base['failures'] + base['errors']))
          print(summary)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as stream:
              stream.write(summary)
          PY
      - name: Commit the tested source to the feature branch
        run: |
          test "$GITHUB_REF_NAME" = feature/illumina-pe-project-routing
          git fetch origin "$GITHUB_REF_NAME"
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md docs scripts tests/test_illumina_pe.py
          git commit -m 'feat: implement project-wide Illumina PE tail trimming and routing'
          git push origin HEAD:refs/heads/feature/illumina-pe-project-routing
          git show --stat --oneline HEAD >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve test results and patch
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: illumina-pe-validation
          path: |
            ${{ runner.temp }}/illumina-tests.log
            ${{ runner.temp }}/baseline.log
            ${{ runner.temp }}/baseline.json
            ${{ runner.temp }}/revision.log
            ${{ runner.temp }}/revision.json
            ${{ runner.temp }}/illumina-pe.patch
          retention-days: 7
