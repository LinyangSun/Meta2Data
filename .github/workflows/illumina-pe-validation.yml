name: Illumina PE validation

on:
  push:
    branches: [feature/illumina-pe-project-routing]
    paths: [.github/workflows/illumina-pe-validation.yml]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Archive reviewed source
        run: git archive --format=tar.gz --output=source.tar.gz HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: illumina-pe-source
          path: source.tar.gz
          retention-days: 3
