name: Illumina PE validation

on:
  push:
    branches: [feature/illumina-pe-project-routing]
    paths: [.github/workflows/illumina-pe-validation.yml]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install validation dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y vsearch
          python -m pip install 'cutadapt>=4,<6' biopython pandas numpy biom-format
