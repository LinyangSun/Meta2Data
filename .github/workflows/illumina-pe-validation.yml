name: Illumina PE validation

on:
  pull_request:
    branches: [main]
    paths: ['scripts/**', 'tests/**', 'bin/**', 'docs/parameters.default.json', '.github/workflows/illumina-pe-validation.yml']
  push:
    branches: [main, feature/illumina-pe-project-routing]
    paths: ['scripts/**', 'tests/**', 'bin/**', 'docs/parameters.default.json', '.github/workflows/illumina-pe-validation.yml']

permissions:
  contents: read

concurrency:
  group: illumina-pe-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install validation dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y vsearch
          python -m pip install 'cutadapt>=4,<6' biopython pandas numpy biom-format requests
      - name: Check Python and shell syntax
        run: |
          python -m compileall -q scripts tests
          for script in scripts/*.sh bin/*; do bash -n "$script"; done
          git diff --check
      - name: Test Illumina processing, primer handling, checkpoints and CLI scope
        run: |
          vsearch --version
          cutadapt --version
          python - <<'PY' 2>&1 | tee "$RUNNER_TEMP/validation.log"
          import sys
          import unittest
          # This job validates the changed processing path and its shared entry
          # points. It is not a claim that every unrelated platform test passes.
          patterns = [
              'test_illumina_pe.py', 'test_explicit_primers.py',
              'test_processing_state.py', 'test_pip_cli.py',
              'test_read_layout.py', 'test_project_primers.py',
              'test_entrypoints.py', 'test_local_datasets.py', 'test_pip_helpers.py',
          ]
          suite = unittest.TestSuite()
          for pattern in patterns:
              suite.addTests(unittest.defaultTestLoader.discover('tests', pattern=pattern))
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          sys.exit(0 if result.wasSuccessful() and not result.skipped else 1)
          PY
      - name: Preserve validation log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: illumina-pe-validation
          path: ${{ runner.temp }}/validation.log
          retention-days: 7
