# Minimal direct requirements for Meta2Data on Linux x86_64 with glibc >=2.28.
# QIIME plugins come from the official 2026.7 release channel. Their declared
# dependencies use the release constraints; this is not the full distribution.
# environment-constraints-linux-64.txt preserves the compatible release closure.
# Use scripts/create_conda_environment.py for isolated channels and pinned SRA.
# Classifiers must be trained with scikit-learn 1.7.1.
name: meta2data
channels:
- conda-forge
- bioconda
- https://packages.qiime2.org/qiime2/2026.7/qiime2/released
- nodefaults
dependencies:
# Framework, CLI, and the eight plugins called by the pipeline/model builder.
- python=3.12.13
- qiime2=2026.7.0
- rachis=2026.7.0
- q2cli=2026.7.0
- q2-dada2=2026.7.0
- q2-demux=2026.7.0
- q2-feature-classifier=2026.7.0
- q2-feature-table=2026.7.0
- q2-fragment-insertion=2026.7.0
- q2-phylogeny=2026.7.0
- q2-quality-filter=2026.7.0
- rescript=2026.7.0
- scikit-learn=1.7.1
# Python modules imported directly by Meta2Data.
- biopython=1.88
- biom-format=2.1.17
- numpy=2.4.2
- pandas=2.3.3
- openpyxl=3.1.5
- psutil=7.2.2
- requests=2.34.2
# Executables called directly. The shared installer adds the official NCBI
# SRA Toolkit 3.4.1 separately; neither q2-fondue nor conda sra-tools is needed.
- blast=2.17.0
- chopper=0.15.0
- curl=8.21.0
- cutadapt=5.2
- fastp=1.0.1
- minimap2=2.31
- racon=1.5.0
- samtools=1.22.1
- unzip=6.0
- vsearch=2.30.4
- wget=1.25.0
